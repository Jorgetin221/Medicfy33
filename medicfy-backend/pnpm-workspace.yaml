packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  # ioredis (peer de bullmq) trae msgpackr-extract como addon
  # nativo opcional para su soporte de msgpack; ioredis tiene fallback
  # puro-JS, así que no se aprueba su build script (ver comentario en
  # AppointmentReminderSchedulerService).
  msgpackr-extract: false
  prisma: true
  sharp: true
# Auditoría 2026-10-21 (A-24): transitivas vulnerables de NestJS 10 y
# @nestjs/swagger, forzadas a la primera versión parcheada dentro de su
# misma versión mayor (sin cambios de API). Pendiente aparte: el aviso
# moderado de @nestjs/core solo se corrige en NestJS 11 (migración
# mayor), y el de file-type solo afecta a FileTypeValidator, que este
# API no usa.
overrides:
  proxy-addr: ^2.0.8
  js-yaml: ^4.3.2
  lodash: ^4.17.24
  multer: ^2.3.0
  body-parser: ^1.20.6
  qs: ^6.16.0
