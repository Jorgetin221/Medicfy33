# Auditoría 2026-10-21 (A-16, A-19, C-03) — endurecimiento de nginx.
#
# Este repositorio no administra el nginx de producción (no hay
# Terraform para él); este archivo es la referencia de lo que hay que
# aplicar a mano en el servidor, dentro de los bloques `server` de
# medicfy.com.mx y api.medicfy.com.mx. Probar con `nginx -t` antes de
# recargar.

# En el bloque `http` (nginx.conf): no anunciar la versión de nginx.
server_tokens off;

# ── api.medicfy.com.mx ──────────────────────────────────────────────
# location / {
#     proxy_pass http://127.0.0.1:3001;
#     # A-16: el API confía en exactamente 1 salto (TRUST_PROXY_HOPS=1).
#     # Se REEMPLAZA X-Forwarded-For con la IP real, no se agrega a lo
#     # que mande el cliente, para que no pueda falsificarla.
#     proxy_set_header X-Forwarded-For   $remote_addr;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_set_header Host              $host;
# }

# ── medicfy.com.mx ──────────────────────────────────────────────────
# C-03: la app no usa next/image; el optimizador queda apagado en
# next.config.ts, y aquí se cierra la ruta por si acaso.
# location /_next/image {
#     return 404;
# }
# location / {
#     proxy_pass http://127.0.0.1:3000;
#     proxy_set_header X-Forwarded-For   $remote_addr;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_set_header Host              $host;
# }

# Las cabeceras de seguridad (HSTS, CSP, X-Frame-Options, nosniff) ya
# las ponen la aplicación web (next.config.ts) y el API
# (common/security-headers.ts); no se duplican aquí.
